name: hotel_management_system
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.1.1
  image_picker: ^1.1.2 
  signature: ^5.5.0
  image_gallery_saver: ^2.0.3
  path_provider: ^2.1.0
  permission_handler: ^11.3.1
  provider: ^6.1.5+1
  dio: ^5.11.0
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^10.3.1
  envied: ^1.2.1
  envied_generator: ^1.1.1
  url_launcher: 6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.7

flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/images/authLogo/
    - assets/images/rooms/
    - assets/images/houses/
    - assets/images/furnitures/
  fonts:
    - family: Prompt
      fonts:
        - asset: assets/fonts/Prompt/Prompt-Regular.ttf
        - asset: assets/fonts/Prompt/Prompt-Bold.ttf
          weight: 700
